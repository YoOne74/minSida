<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <link rel="icon" href="../../shared/celesteBadelinePFP.png" />
    <title>Haiii :p</title>
  </head>
  <body>
    <video autoplay loop id="backgroundVideo">
      <source
        src="content/Celeste Summit Ending Live Wallpaper.mp4"
        type="video/mp4"
      />
    </video>

    <div class="desktop">
      <div id="cristofferIcon" class="desktopIcon">
        <img src="content/cristoffer.jpg" alt="cristoffer" />
        <p>christoffer.jpg</p>
      </div>
      <div id="aboutMeIcon" class="desktopIcon">
        <img src="content/archLogo.png" alt="archlogo" />
        <p>welcome.txt</p>
      </div>
      <div id="aboutme" class="desktopIcon">
        <img src="content/archLogo.png" alt="archlogo" />
        <p>abooutme.html</p>
      </div>

      <div id="linksFolderIcon" class="desktopIcon">
        <img src="content/folder.png" alt="folder icon" />
        <p>links</p>
      </div>

      <div class="taskbar" style="z-index: 9000">
      <button onclick="startButton()" class="startButton">
        <img class="target" src="content/archLogo.png" alt="windows logo" />
      </button>

      <div class="clock-container">
        <p id="time">13:37</p>
      </div>
    </div>
    <div id="startButtonContent" class="droppDownContent target">
      <div id="searchBar">
        <input class="target" type="text" name="wo" placeholder="search:" />
      </div>
      <div class="startMenu">
        <h2>Favorites:</h2>
        <div class="favoritesList">
          <div class="favorite">
            <a href="https://www.tumblr.com">
              <img src="content/tumblr.png" alt="thingy" />
              <p>Tumblr</p>
            </a>
          </div>
          <div class="favorite">
            <a href="https://www.xkcd.com">
              <img src="content/xkcdLogo.png" alt="thingy" />
              <p>Xkcd!</p>
            </a>
          </div>
        </div>
        <h2>Why does this exist?</h2>
        <p>
          Well there is quite the simple answer, I needed to make something for
          school and this seemed fun. I also hope to update this site ever so
          often as I do more things
        </p>
      </div>
      <div class="shutdownButtons">
        <button id="logoutButton" onclick="">logout</button>
        <button id="restartButton" onclick="location.reload()">restart</button>
        <button id="shutdownButton" onclick="open(location, '_self').close()">
          shutdown
        </button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
